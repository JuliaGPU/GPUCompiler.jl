name: Test

on:
  push:
    branches:
    - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release_test:
    name: Julia ${{ matrix.version }} ${{ matrix.llvm_args }}${{ matrix.coverage == 'false' && ' (no coverage)' || '' }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1.11', '1.12', '1.13', 'nightly']
        os: [ubuntu-24.04, ubuntu-24.04-arm, macOS-15, windows-2025]
        llvm_args: ['']
        coverage: ['true']
        include:
          # code coverage recompiles the package instead of using its precompiled code,
          # which hides bugs in how that code interacts with methods back-ends define
          - version: '1.12'
            os: 'ubuntu-24.04'
            llvm_args: ''
            coverage: 'false'
          # starting with Julia 1.10, we can enable opaque pointers
          # from Julia 1.12 on, this is the default.
          - version: '1.10'
            os: 'ubuntu-24.04'
            llvm_args: '--opaque-pointers'
          - version: '1.10'
            os: 'ubuntu-24.04-arm'
            llvm_args: '--opaque-pointers'
          - version: '1.10'
            os: 'macOS-15'
            llvm_args: '--opaque-pointers'
          - version: '1.10'
            os: 'windows-2025'
            llvm_args: '--opaque-pointers'
          - version: '1.11'
            os: 'ubuntu-24.04'
            llvm_args: '--opaque-pointers'
          - version: '1.11'
            os: 'ubuntu-24.04-arm'
            llvm_args: '--opaque-pointers'
          - version: '1.11'
            os: 'macOS-15'
            llvm_args: '--opaque-pointers'
          - version: '1.11'
            os: 'windows-2025'
            llvm_args: '--opaque-pointers'
    steps:
      - uses: actions/checkout@v7

      - name: Install Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}

      - name: Set-up cache
        uses: julia-actions/cache@v3

      - name: Run tests
        uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.coverage != 'false' }}
        env:
          JULIA_LLVM_ARGS: ${{ matrix.llvm_args }}

      - name: Process coverage
        # CoverageTools 1.4.1 uses a PkgLoadSpec field renamed in Julia 1.14.
        if: matrix.version != 'nightly' && matrix.coverage != 'false'
        uses: julia-actions/julia-processcoverage@v1
      - name: Submit coverage
        if: matrix.version != 'nightly' && matrix.coverage != 'false'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          files: lcov.info

  handoff_test:
    # the late hand-off to libLLVMGPU, for the targets that support it (the others are
    # tested as usual)
    name: Julia ${{ matrix.version }} with libLLVMGPU - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ['1.12', '1.13']
        os: [ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7

      - name: Install Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}

      - name: Set-up cache
        uses: julia-actions/cache@v3

      - name: Select the late hand-off
        run: |
          julia --project=test -e 'using Pkg; Pkg.add(name="LLVMGPU_jll", version="1")'
          for dir in . test; do
              printf '[GPUCompiler]\nhandoff = "late"\n' >> $dir/LocalPreferences.toml
          done

      - name: Run tests
        uses: julia-actions/julia-runtest@v1
        env:
          # (checked by the tests, so that they don't silently test without the hand-off)
          GPUCOMPILER_TEST_HANDOFF: late
