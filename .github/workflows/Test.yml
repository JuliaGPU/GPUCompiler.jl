name: Test

on:
  push:
    branches:
    - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release_test:
    name: Julia ${{ matrix.version }} ${{ matrix.llvm_args }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1.11', '1.12', '1.13-nightly', 'nightly']
        os: [ubuntu-24.04, ubuntu-24.04-arm, macOS-15, windows-2025]
        llvm_args: ['']
        include:
          # starting with Julia 1.10, we can enable opaque pointers
          # from Julia 1.12 on, this is the default.
          - version: '1.10'
            os: 'ubuntu-24.04'
            llvm_args: '--opaque-pointers'
          - version: '1.10'
            os: 'ubuntu-24.04-arm'
            llvm_args: '--opaque-pointers'
          - version: '1.10'
            os: 'macOS-15'
            llvm_args: '--opaque-pointers'
          - version: '1.10'
            os: 'windows-2025'
            llvm_args: '--opaque-pointers'
          - version: '1.11'
            os: 'ubuntu-24.04'
            llvm_args: '--opaque-pointers'
          - version: '1.11'
            os: 'ubuntu-24.04-arm'
            llvm_args: '--opaque-pointers'
          - version: '1.11'
            os: 'macOS-15'
            llvm_args: '--opaque-pointers'
          - version: '1.11'
            os: 'windows-2025'
            llvm_args: '--opaque-pointers'
    steps:
      - uses: actions/checkout@v7

      - name: Install Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}

      - name: Set-up cache
        uses: julia-actions/cache@v3

      - name: Run tests
        uses: julia-actions/julia-runtest@v1
        env:
          JULIA_LLVM_ARGS: ${{ matrix.llvm_args }}

      - name: Process coverage
        uses: julia-actions/julia-processcoverage@v1
      - name: Submit coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          files: lcov.info
