name: TestAsserts

# This workflow runs tests using assert builds downloaded by GetAsserts.
# It does not use any secrets (BUILDKITE_TOKEN access is confined to GetAsserts).
#
# The real GetAsserts never runs on `pull_request`, so a same-named workflow added by a
# fork PR cannot be used to feed this workflow an attacker-built artifact.

# Every run of this workflow is listed as running on the default branch, so name it after
# what triggered GetAsserts (the PR title or commit message, and the branch).
run-name: "${{ github.event.workflow_run.display_title }} (${{ github.event.workflow_run.head_branch }})"

on:
  workflow_run:
    workflows: ["GetAsserts"]
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  # GetAsserts runs from the branch that triggered it, so its matrix decides which versions
  # get tested; e.g. release branches don't test Julia master.
  versions:
    name: Determine Julia versions
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event != 'pull_request'
    permissions:
      actions: read
    outputs:
      versions: ${{ steps.versions.outputs.result }}
    steps:
      - name: List the downloaded builds
        id: versions
        uses: actions/github-script@v9
        with:
          script: |
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: ${{ github.event.workflow_run.id }},
              per_page: 100,
            });
            return jobs
              .map(job => job.name.match(/^Download Julia (\S+) \(x86_64-linux-gnuassert\)$/))
              .filter(match => match)
              .map(match => match[1]);

  report-start:
    name: Report assertion tests started
    needs: versions
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      checks: write
    steps:
      - name: Report in-progress
        uses: actions/github-script@v9
        env:
          VERSIONS: ${{ needs.versions.outputs.versions }}
        with:
          # GitHub ignores `details_url` on check runs created with GITHUB_TOKEN, so the
          # check's "Details" page only shows its output; link the logs from there.
          script: |
            const versions = JSON.parse(process.env.VERSIONS);
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await Promise.all(versions.map(version =>
              github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: '${{ github.event.workflow_run.head_sha }}',
                name: `Julia ${version} (assert) - Linux`,
                status: 'in_progress',
                output: {
                  title: 'Assert build test in progress',
                  summary: `Testing against the \`x86_64-linux-gnuassert\` build of Julia ${version}: [workflow run](${url}).`
                }
              })
            ));

  test:
    name: Julia ${{ matrix.version }} (assert) - Linux
    needs: [versions, report-start]
    if: needs.versions.outputs.versions != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.versions.outputs.versions) }}
    steps:
      - name: Download Julia build
        uses: actions/download-artifact@v8
        with:
          name: julia-${{ matrix.version }}-x86_64-linux-gnuassert
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Install Julia
        run: |
          tar -xf julia.tar.gz -C ../
          rm julia.tar.gz
          echo $PWD/../julia-*/bin >> $GITHUB_PATH

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # GetAsserts only runs trusted base-branch code. This job intentionally tests the
          # resulting artifact against the triggering revision without exposing credentials.
          allow-unsafe-pr-checkout: true
          persist-credentials: false

      # NOTE: no julia-actions/cache here; this job runs untrusted code in the
      #       default-branch cache scope, so it must not write to the cache.
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  report-result:
    name: Report assertion test results
    needs: [versions, test]
    if: always() && needs.versions.result == 'success' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
    steps:
      - name: Report check run
        uses: actions/github-script@v9
        env:
          VERSIONS: ${{ needs.versions.outputs.versions }}
        with:
          script: |
            const versions = JSON.parse(process.env.VERSIONS);
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              attempt_number: Number(process.env.GITHUB_RUN_ATTEMPT),
              per_page: 100,
            });
            // the end of a failed job's log, up to the step that failed: from the first error
            // or test summary near the end, which covers both precompilation failures (often
            // several long stack traces) and the test summary followed by its failures
            const excerpt = async job => {
              let log;
              try {
                const {data} = await github.rest.actions.downloadJobLogsForWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  job_id: job.id,
                });
                log = typeof data === 'string' ? data : Buffer.from(data).toString();
              } catch (err) {
                core.warning(`Could not download the log of ${job.name}: ${err.message}`);
                return null;
              }
              let lines = log.split('\n').map(line => line
                .replace(/^\d{4}-\d\d-\d\dT[\d:.]+Z ?/, '')
                .replace(/\x1b\[[0-9;]*m/g, ''));
              const failed = lines.findLastIndex(line => line.startsWith('##[error]'));
              if (failed !== -1)
                lines = lines.slice(0, failed);
              lines = lines
                .filter(line => !/^##\[(end)?group\]/.test(line))
                .slice(-400)
                .map(line => line.length > 500 ? line.slice(0, 500) + '…' : line);
              const start = lines.findIndex(line => /^(ERROR:|Test Summary:)/.test(line));
              lines = lines.slice(start === -1 ? -100 : start);
              // check run text is limited to 65535 characters
              while (lines.join('\n').length > 60000)
                lines.shift();
              // the log is untrusted, so make sure it cannot close the code block
              const ticks = Math.max(3, ...lines.map(line =>
                Math.max(0, ...(line.match(/`+/g) || []).map(run => run.length + 1))));
              const fence = '`'.repeat(ticks);
              return `${fence}\n${lines.join('\n')}\n${fence}`;
            };

            await Promise.all(versions.map(async version => {
              const name = `Julia ${version} (assert) - Linux`;
              const job = jobs.find(job => job.name === name);
              const conclusion = job?.conclusion || 'failure';
              const url = job?.html_url ||
                `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              const output = {
                title: `Assert build test ${conclusion}`,
                summary: `Tested against the \`x86_64-linux-gnuassert\` build of Julia ${version}: [job log](${url}).`
              };
              if (job && conclusion === 'failure') {
                const text = await excerpt(job);
                if (text)
                  output.text = `End of the job log:\n\n${text}`;
              }
              return github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: '${{ github.event.workflow_run.head_sha }}',
                name,
                status: 'completed',
                conclusion,
                output,
              });
            }));

  report-failure:
    name: Report download failure
    needs: versions
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure'
    permissions:
      checks: write
    steps:
      - name: Report check runs
        uses: actions/github-script@v9
        env:
          VERSIONS: ${{ needs.versions.outputs.versions }}
        with:
          script: |
            const versions = JSON.parse(process.env.VERSIONS);
            await Promise.all(versions.map(version =>
              github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: '${{ github.event.workflow_run.head_sha }}',
                name: `Julia ${version} (assert) - Linux`,
                status: 'completed',
                conclusion: 'failure',
                output: {
                  title: 'Assert build download failed',
                  summary: `The [GetAsserts workflow](${{ github.event.workflow_run.html_url }}) failed to download the Julia build.`
                }
              })
            ));
