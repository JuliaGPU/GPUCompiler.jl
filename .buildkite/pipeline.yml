# The Buildkite web UI uploads this file. It only launches the actual test steps, in
# `downstream.yml`, through `launch.sh`, which decides whether those steps are selected
# by the files a pull request changes. See the Development section of the README.
steps:
  - label: ":pipeline: Launch"
    command: .buildkite/launch.sh
    agents:
      queue: "upload"
    timeout_in_minutes: 5
