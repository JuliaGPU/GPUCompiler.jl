# These test the last release of each back-end that uses GPUCompiler 1.x. Their test
# suites have since started failing against newer dependencies (e.g. GPUArrays' test
# suite, Julia's LinearAlgebra), independently of GPUCompiler, so failures don't block.

steps:
  - label: "CUDA.jl"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.12"
      - JuliaCI/julia-coverage#v1:
          codecov: true
    command: |
      unset LD_LIBRARY_PATH
      julia -e 'println("--- :julia: Instantiating project")
                using Pkg
                Pkg.develop(; path=pwd())
                Pkg.add(; name="CUDA", version="6.2")' || exit 3

      julia -e 'println("+++ :julia: Running tests")
                using Pkg
                Pkg.test("CUDA"; coverage=true)'
    agents:
      queue: "cuda"
    if: build.message !~ /\[skip tests\]/ && !build.pull_request.draft
    timeout_in_minutes: 120
    soft_fail: true

  - label: "oneAPI.jl"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.12"
      - JuliaCI/julia-coverage#v1:
          codecov: true
    command: |
      julia -e 'using Pkg;

                println("--- :julia: Instantiating project")
                Pkg.develop(; path=pwd())

                # building the support library writes to the package directory
                oneapi = joinpath(Pkg.devdir(), "oneAPI")
                run(`git clone --depth=1 --branch=v2.7.0 https://github.com/JuliaGPU/oneAPI.jl $$oneapi`)
                Pkg.develop(; path=oneapi)

                println("+++ :julia: Building support library")
                include(joinpath(Pkg.devdir(), "oneAPI", "deps", "build_ci.jl"))' || exit 3

      julia -e 'println("+++ :julia: Running tests")
                using Pkg
                Pkg.test("oneAPI"; coverage=true)'
    agents:
      queue: "oneapi"
    if: build.message !~ /\[skip tests\]/ && !build.pull_request.draft
    timeout_in_minutes: 60
    soft_fail: true

  - label: "AMDGPU.jl"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.12"
      - JuliaCI/julia-coverage#v1:
          codecov: true
    command: |
       julia -e 'println("--- :julia: Instantiating project")
                 using Pkg
                 Pkg.develop(; path=pwd())
                 Pkg.add(; name="AMDGPU", version="2.7")' || exit 3

       julia -e 'println("+++ :julia: Running tests")
                 using Pkg
                 Pkg.test("AMDGPU"; coverage=true)'
    agents:
      queue: "rocm"
    if: build.message !~ /\[skip tests\]/ && !build.pull_request.draft
    timeout_in_minutes: 120
    soft_fail: true

  - label: "Metal.jl"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.12"
      - JuliaCI/julia-coverage#v1:
          codecov: true
    command: |
      julia -e 'println("--- :julia: Instantiating project")
                using Pkg
                Pkg.develop(; path=pwd())
                Pkg.add(; name="Metal", version="1.10")' || exit 3

      julia -e 'println("+++ :julia: Running tests")
                using Pkg
                Pkg.test("Metal"; coverage=true)'
    agents:
      queue: "metal"
    if: build.message !~ /\[skip tests\]/ && !build.pull_request.draft
    timeout_in_minutes: 120
    soft_fail: true

  - label: "OpenCL.jl"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.12"
      - JuliaCI/julia-coverage#v1:
          codecov: true
    command: |
      julia -e 'println("--- :julia: Instantiating project")
                using Pkg
                Pkg.develop(; path=pwd())
                Pkg.add(; name="OpenCL", version="0.10.10")' || exit 3

       julia -e 'println("+++ :julia: Running tests")
                using Pkg
                Pkg.test("OpenCL"; coverage=true)'
    agents:
      # XXX: not on "juliaecosystem" because those workers don't have libc-dev
      #      see JuliaGPU/OpenCL.jl#303
      queue: "cuda"
    if: build.message !~ /\[skip tests\]/ && !build.pull_request.draft
    timeout_in_minutes: 120
    soft_fail: true

env:
  JULIA_PKG_SERVER: "" # it often struggles with our large artifacts
