# Tests of the packages that build on GPUCompiler, uploaded by `launch.sh`.
#
# Each step's `if_changed` lists the files that can affect that package: everything in
# `src/` and `ext/`, `Project.toml` and the CI configuration, except the other back-ends'
# target files. The `if:` conditions implement the commit message tags documented in the
# Development section of the README; keep both in sync when adding a step.
#
# Every package also gets an "(llvmgpu)" step, which runs its tests with the llvmgpu
# toolchain (the `toolchain = "llvmgpu"` preference, set up by `.ci/toolchain.jl` in an
# environment of its own, as the default one persists on some agents).
# `[only llvmgpu]` selects only those steps and `[skip llvmgpu]` skips them; a package's own
# tags (e.g. `[only cuda]`) select both of its steps. Steps are skipped on draft pull
# requests unless a tag selects them.
steps:
  - label: "CUDA.jl"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.13"
      - JuliaCI/julia-coverage#v1:
          codecov: true
    command: |
      unset LD_LIBRARY_PATH
      julia -e 'println("--- :julia: Instantiating project")
                using Pkg
                Pkg.develop(; path=pwd())
                Pkg.develop(; name="CUDA")' || exit 3

      julia -e 'println("+++ :julia: Running tests")
                using Pkg
                Pkg.test("CUDA"; coverage="@" * pwd())'
    agents:
      queue: "cuda"
    env:
      # The agents budget 2 threads per job, but CUDA.jl's test suite is compile-bound
      # and the CI hosts have CPU to spare. This raises the number of test workers,
      # which CUDA.jl's runtests.jl still caps by the available GPU memory.
      JULIA_CPU_THREADS: "3"
    if_changed:
      include: &sources
        - "src/**"
        - "ext/**"
        - "Project.toml"
        - ".buildkite/**"
        - ".ci/**"
      exclude:
        - "src/{gcn,spirv,metal,bpf,native}.jl"
    if: |
      build.message !~ /\[skip [^\]]*(tests|cuda|ptx)/ &&
      (build.message =~ /\[only [^\]]*(cuda|ptx)/ ||
       build.message !~ /\[only / && !build.pull_request.draft)
    timeout_in_minutes: 120
    soft_fail:
      - exit_status: 3

  - label: "CUDA.jl (llvmgpu)"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.13"
    command: |
      unset LD_LIBRARY_PATH
      echo "--- :julia: Instantiating project"
      # an environment and checkouts of its own, so that the preference and the edited test
      # environment don't reach the other steps
      export JULIA_PROJECT="$$(mktemp -d)"
      export JULIA_PKG_DEVDIR="$$JULIA_PROJECT/dev"
      julia .ci/toolchain.jl CUDA

      julia -e 'println("+++ :julia: Running tests")
                using Pkg
                Pkg.test("CUDA")'
    agents:
      queue: "cuda"
    env:
      JULIA_CPU_THREADS: "3"
    if_changed:
      include: *sources
      exclude:
        - "src/{gcn,spirv,metal,bpf,native}.jl"
    if: |
      build.message !~ /\[skip [^\]]*(tests|cuda|ptx|llvmgpu)/ &&
      (build.message =~ /\[only [^\]]*(cuda|ptx|llvmgpu)/ ||
       build.message !~ /\[only / && !build.pull_request.draft)
    timeout_in_minutes: 120
    # until the package works with IR of libLLVMGPU (JuliaGPU/CUDA.jl#3627)
    soft_fail: true

  - label: "oneAPI.jl"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.13"
      - JuliaCI/julia-coverage#v1:
          codecov: true
    command: |
      julia -e 'using Pkg;

                println("--- :julia: Instantiating project")
                Pkg.develop(; path=pwd())
                Pkg.develop(; name="oneAPI")

                println("+++ :julia: Building support library")
                include(joinpath(Pkg.devdir(), "oneAPI", "deps", "build_ci.jl"))' || exit 3

      julia -e 'println("+++ :julia: Running tests")
                using Pkg
                Pkg.test("oneAPI"; coverage="@" * pwd())'
    agents:
      queue: "oneapi"
    if_changed:
      include: *sources
      exclude:
        - "src/{ptx,gcn,metal,bpf,native}.jl"
    if: |
      build.message !~ /\[skip [^\]]*(tests|oneapi|spirv)/ &&
      (build.message =~ /\[only [^\]]*(oneapi|spirv)/ ||
       build.message !~ /\[only / && !build.pull_request.draft)
    timeout_in_minutes: 60
    soft_fail:
      - exit_status: 3

  - label: "oneAPI.jl (llvmgpu)"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.13"
    command: |
      echo "--- :julia: Instantiating project"
      # an environment and checkouts of its own, so that the preference and the edited test
      # environment don't reach the other steps
      export JULIA_PROJECT="$$(mktemp -d)"
      export JULIA_PKG_DEVDIR="$$JULIA_PROJECT/dev"
      julia .ci/toolchain.jl oneAPI
      julia -e 'using Pkg;
                println("+++ :julia: Building support library")
                include(joinpath(Pkg.devdir(), "oneAPI", "deps", "build_ci.jl"))'

      julia -e 'println("+++ :julia: Running tests")
                using Pkg
                Pkg.test("oneAPI")'
    agents:
      queue: "oneapi"
    if_changed:
      include: *sources
      exclude:
        - "src/{ptx,gcn,metal,bpf,native}.jl"
    if: |
      build.message !~ /\[skip [^\]]*(tests|oneapi|spirv|llvmgpu)/ &&
      (build.message =~ /\[only [^\]]*(oneapi|spirv|llvmgpu)/ ||
       build.message !~ /\[only / && !build.pull_request.draft)
    timeout_in_minutes: 60
    # until the package works with IR of libLLVMGPU (JuliaGPU/oneAPI.jl#780)
    soft_fail: true

  - label: "AMDGPU.jl"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.13"
      - JuliaCI/julia-coverage#v1:
          codecov: true
    command: |
       julia -e 'println("--- :julia: Instantiating project")
                 using Pkg
                 Pkg.develop(; path=pwd())
                 Pkg.develop(; name="AMDGPU")' || exit 3

       julia -e 'println("+++ :julia: Running tests")
                 using Pkg
                 Pkg.test("AMDGPU"; coverage="@" * pwd())'
    agents:
      queue: "rocm"
    if_changed:
      include: *sources
      exclude:
        - "src/{ptx,spirv,metal,bpf,native}.jl"
    if: |
      build.message !~ /\[skip [^\]]*(tests|amdgpu|gcn)/ &&
      (build.message =~ /\[only [^\]]*(amdgpu|gcn)/ ||
       build.message !~ /\[only / && !build.pull_request.draft)
    timeout_in_minutes: 60
    soft_fail:
      - exit_status: 3

  - label: "AMDGPU.jl (llvmgpu)"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.13"
    command: |
      echo "--- :julia: Instantiating project"
      # an environment and checkouts of its own, so that the preference and the edited test
      # environment don't reach the other steps
      export JULIA_PROJECT="$$(mktemp -d)"
      export JULIA_PKG_DEVDIR="$$JULIA_PROJECT/dev"
      julia .ci/toolchain.jl AMDGPU

      julia -e 'println("+++ :julia: Running tests")
                using Pkg
                Pkg.test("AMDGPU")'
    agents:
      queue: "rocm"
    if_changed:
      include: *sources
      exclude:
        - "src/{ptx,spirv,metal,bpf,native}.jl"
    if: |
      build.message !~ /\[skip [^\]]*(tests|amdgpu|gcn|llvmgpu)/ &&
      (build.message =~ /\[only [^\]]*(amdgpu|gcn|llvmgpu)/ ||
       build.message !~ /\[only / && !build.pull_request.draft)
    timeout_in_minutes: 60
    # until the package works with IR of libLLVMGPU (JuliaGPU/AMDGPU.jl#1250)
    soft_fail: true

  - label: "Metal.jl"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.13"
      - JuliaCI/julia-coverage#v1:
          codecov: true
    command: |
      julia -e 'println("--- :julia: Instantiating project")
                using Pkg
                withenv("JULIA_PKG_PRECOMPILE_AUTO" => 0) do
                    Pkg.develop(; path=pwd())
                    Pkg.develop(; name="Metal")

                    # Metal runs its example suites in their own workspace
                    # environments, which resolve through the manifest of the
                    # Metal checkout; instantiate that workspace, against this
                    # GPUCompiler, so those environments can actually load.
                    gpucompiler = pwd()
                    Pkg.activate(joinpath(Pkg.devdir(), "Metal"))
                    Pkg.develop(; path=gpucompiler)
                    Pkg.instantiate(workspace=true)
                end' || exit 3

      julia -e 'println("+++ :julia: Running tests")
                using Pkg
                Pkg.test("Metal"; coverage="@" * pwd())'
    agents:
      queue: "metal"
    if_changed:
      include: *sources
      exclude:
        - "src/{ptx,gcn,spirv,bpf,native}.jl"
    if: |
      build.message !~ /\[skip [^\]]*(tests|metal)/ &&
      (build.message =~ /\[only [^\]]*metal/ ||
       build.message !~ /\[only / && !build.pull_request.draft)
    timeout_in_minutes: 120
    soft_fail:
      - exit_status: 3

  - label: "Metal.jl (llvmgpu)"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.13"
    command: |
      echo "--- :julia: Instantiating project"
      # an environment and checkouts of its own, so that the preference and the edited test
      # environment don't reach the other steps
      export JULIA_PROJECT="$$(mktemp -d)"
      export JULIA_PKG_DEVDIR="$$JULIA_PROJECT/dev"
      JULIA_PKG_PRECOMPILE_AUTO=0 julia .ci/toolchain.jl Metal --workspace

      julia -e 'println("+++ :julia: Running tests")
                using Pkg
                Pkg.test("Metal")'
    agents:
      queue: "metal"
    if_changed:
      include: *sources
      exclude:
        - "src/{ptx,gcn,spirv,bpf,native}.jl"
    if: |
      build.message !~ /\[skip [^\]]*(tests|metal|llvmgpu)/ &&
      (build.message =~ /\[only [^\]]*(metal|llvmgpu)/ ||
       build.message !~ /\[only / && !build.pull_request.draft)
    timeout_in_minutes: 120

  - label: "OpenCL.jl"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.13"
      - JuliaCI/julia-coverage#v1:
          codecov: true
    command: |
      julia -e 'println("--- :julia: Instantiating project")
                using Pkg
                Pkg.develop(; path=pwd())
                Pkg.develop(; name="OpenCL")
                Pkg.develop(; name="SPIRVIntrinsics")' || exit 3

       julia -e 'println("+++ :julia: Running tests")
                using Pkg
                Pkg.test("OpenCL"; coverage="@" * pwd())'
    agents:
      queue: "cuda"
    if_changed:
      include: *sources
      exclude:
        - "src/{ptx,gcn,metal,bpf,native}.jl"
    if: |
      build.message !~ /\[skip [^\]]*(tests|opencl|spirv)/ &&
      (build.message =~ /\[only [^\]]*(opencl|spirv)/ ||
       build.message !~ /\[only / && !build.pull_request.draft)
    timeout_in_minutes: 120
    soft_fail:
      - exit_status: 3

  - label: "OpenCL.jl (llvmgpu)"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.13"
    command: |
      echo "--- :julia: Instantiating project"
      # an environment and checkouts of its own, so that the preference and the edited test
      # environment don't reach the other steps
      export JULIA_PROJECT="$$(mktemp -d)"
      export JULIA_PKG_DEVDIR="$$JULIA_PROJECT/dev"
      julia .ci/toolchain.jl OpenCL SPIRVIntrinsics

      julia -e 'println("+++ :julia: Running tests")
                using Pkg
                Pkg.test("OpenCL")'
    agents:
      queue: "cuda"
    if_changed:
      include: *sources
      exclude:
        - "src/{ptx,gcn,metal,bpf,native}.jl"
    if: |
      build.message !~ /\[skip [^\]]*(tests|opencl|spirv|llvmgpu)/ &&
      (build.message =~ /\[only [^\]]*(opencl|spirv|llvmgpu)/ ||
       build.message !~ /\[only / && !build.pull_request.draft)
    timeout_in_minutes: 120
    # until the package works with IR of libLLVMGPU (JuliaGPU/OpenCL.jl#631)
    soft_fail: true

env:
  JULIA_PKG_SERVER_REGISTRY_PREFERENCE: "eager" # see freshly-registered versions without cloning the registry
